[project]
name = "ae-watch-uk"
version = "0.1.0"
description = "NHS Winter Pressure & A&E Surge Early-Warning System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CHRISH PEP FELIX A" }
]
dependencies = [
    "httpx>=0.28.0",
    "polars>=1.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "tenacity>=9.0.0",
    "openlineage-python>=1.26.0",
    "psycopg[binary,pool]>=3.2.0",
    "dbt-postgres>=1.9.0",
    "google-genai>=1.0.0",
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
    "typer>=0.15.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "torch>=2.4.0",
    "shap>=0.46.0",
    "dowhy>=0.11.0",
    "evidently>=0.4.30",
    "mlflow>=2.17.0",
    "geopandas>=1.0.0",
    "h3>=3.7.6",
    "holidays>=0.60",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "neo4j>=5.26.0",
    "pgvector>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.67.0",
    "pypdf>=7.1.1",
    "pandera>=0.36.0",
    "duckdb>=2.0.1",
    "mapie>=1.6.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "pyarrow>=26.0.1",
    "pandas>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_watch", "src/ingestion", "src/models", "src/evaluation", "src/agents", "src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
