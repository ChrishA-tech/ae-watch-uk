name: AE-Watch UK CI Pipeline

# Author: CHRISH PEP FELIX A
# Project: AE-Watch UK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Code Quality, dbt Parse & Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/neo4jpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1;'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Project Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Ruff Lint Verification
        run: |
          uv run ruff check .

      - name: Ruff Code Formatting Check
        run: |
          uv run ruff format --check .

      - name: Initialize Database Schemas
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aewatch
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d aewatch -f infra/init-scripts/01_init_db.sql

      - name: dbt Manifest Parse & Model Validation
        run: |
          uv run dbt parse --project-dir dbt_ae_watch --profiles-dir dbt_ae_watch

      - name: Run Full Pytest Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aewatch
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: neo4jpassword
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_api_key' }}
          GEMINI_REASONING_MODEL: gemini-3.8-flash
          GEMINI_FAST_MODEL: gemini-3.5-flash-lite
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
        run: |
          uv run pytest -v
