name: AE-Watch UK CI Pipeline

# Author: CHRISH PEP FELIX A
# Project: AE-Watch UK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Code Quality, dbt Parse & Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Project Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Ruff Lint Verification
        run: |
          uv run ruff check src tests

      - name: Ruff Code Formatting Check
        run: |
          uv run ruff format --check src tests

      - name: Start Docker Stack (Postgres with PostGIS + pgvector & Neo4j)
        run: |
          docker compose up -d --build postgres neo4j
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..40}; do
            docker exec aewatch-postgres pg_isready -U aewatch -d aewatch_db && break || sleep 2
          done
          echo "Waiting for Neo4j to be ready..."
          for i in {1..40}; do
            docker exec aewatch-neo4j cypher-shell -u neo4j -p aewatchpass2026 "RETURN 1;" && break || sleep 2
          done

      - name: Load Database Seeds (Bronze, Silver, Gold, RAG)
        run: |
          echo "Loading complete seed data into PostgreSQL..."
          gunzip -c infra/init-scripts/02_seed_data.sql.gz | docker exec -i aewatch-postgres psql -U aewatch -d aewatch_db

      - name: Seed Neo4j Knowledge Graph
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aewatch
          POSTGRES_PASSWORD: aewatchpass2026
          POSTGRES_DB: aewatch_db
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: aewatchpass2026
        run: |
          PYTHONPATH=src uv run python -c "from ae_watch.graph.populator import graph_populator; graph_populator.populate_full_graph()"

      - name: dbt Manifest Parse & Model Validation
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aewatch
          POSTGRES_PASSWORD: aewatchpass2026
          POSTGRES_DB: aewatch_db
        run: |
          uv run dbt parse --project-dir dbt_ae_watch --profiles-dir dbt_ae_watch

      - name: Run v2 Pipeline Smoke Verification (--no-live)
        run: |
          uv run python -m src.run_pipeline --no-live

      - name: Run Full Pytest Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aewatch
          POSTGRES_PASSWORD: aewatchpass2026
          POSTGRES_DB: aewatch_db
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: aewatchpass2026
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_api_key' }}
          GEMINI_REASONING_MODEL: gemini-3.8-flash
          GEMINI_FAST_MODEL: gemini-3.5-flash-lite
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
        run: |
          PYTHONPATH=src uv run pytest -v
